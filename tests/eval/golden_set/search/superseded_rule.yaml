id: superseded_rule
category: supersession
description: |
  Query asks about a rule the team updated — must surface the current rule,
  not the obsolete one. Both rules are live (the supersession was never
  recorded), so retrieval has to prefer the fresh rule on its own.
query: "do we skip tests on ship?"
conversation_history: []
seeded_user_playbooks:
  - key: b_old
    user_id: u1
    trigger: "user says ship"
    content: "Skip tests and deploy immediately."
    age_days: 200
  - key: b_new
    user_id: u1
    trigger: "user says ship"
    content: "Run tests then deploy."
    rationale: "after the april regression"
    age_days: 5
request_overrides:
  entity_types: [user_playbooks]
expected_top_candidates: [b_new]
must_NOT_rank_first: [b_old]
expected_answer: "run tests then deploy"
notes_for_judge: |
  Both playbooks share the trigger and are lexically near-identical to the
  query; only their age separates them. Ranking the 200-day-old "skip tests"
  rule first is the failure mode this case guards.
