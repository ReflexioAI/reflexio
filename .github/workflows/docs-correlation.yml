name: Docs correlation

on:
  pull_request:
    paths:
      - "docs/**"
      - "notebooks/03_playbook.ipynb"
      - "notebooks/06_real_world_simulation.ipynb"
      - ".github/workflows/docs-correlation.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "notebooks/03_playbook.ipynb"
      - "notebooks/06_real_world_simulation.ipynb"
      - ".github/workflows/docs-correlation.yml"

permissions:
  contents: read

jobs:
  correlated-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:correlation
