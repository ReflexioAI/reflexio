[project]
name = "reflexio-ai"
version = "0.2.35"
description = "A Python library for the Reflexio"
authors = [{name = "Reflexio Team"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Client deps (lightweight)
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    # Server deps
    "fastapi>=0.111.1",
    # Explicit security floor for FastAPI's parser.
    "starlette>=1.3.1",
    "uvicorn>=0.34.0",
    # Imported directly for worker-thread limits and offloading.
    "anyio>=4.12.1",
    "openai>=2.8.0",
    # Ceiling: LiteLLMClient depends on litellm 1.x response, tool-call and
    # reasoning shapes; the ceiling protects PyPI installs of reflexio-ai (and
    # claude-smart, through it) from an untested major. Widen once the weekly
    # upstream-canary workflow passes its next-major check for 2.x. Its
    # in-range check proposes lock bumps within the ceiling.
    # Exclusions: 1.106.0-1.108.2 import the proxy-only `mcp` package for
    # every completion that passes `tools`, so tool calls fail with
    # ModuleNotFoundError on a base install (BerriAI/litellm#46045, fixed on
    # main by #45961, which no 1.106/1.108 release carries; 1.109.0rc1
    # passes). Drop them if a 1.108.x patch ships the fix.
    "litellm>=1.105.7,!=1.106.*,!=1.107.*,!=1.108.*,<2",
    "cryptography>=50.0.1",
    "tenacity>=9.0.0",
    "bcrypt>=4.2.1",
    "hdbscan>=0.8.40",
    # Agglomerative clustering and cosine distances for playbook aggregation.
    "scikit-learn>=1.8.0",
    "tiktoken>=0.12.0",
    "slowapi>=0.1.9",
    "cachetools>=6.2.4",
    "colorlog>=6.10.1",
    # Reports process RSS from the health endpoint.
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.0",
    "json-repair>=0.60.1",
    # Ceiling: gepa is pre-1.0 and a 0.x minor may change the optimizer API
    # (gepa.api.optimize, gepa.EvaluationBatch, and the type-only
    # gepa.core.adapter.ProposalFn / gepa.core.state.GEPAState). Widen once the
    # weekly upstream-canary workflow passes its next-major check for 0.2.
    "gepa>=0.1.1,<0.2",
    # CLI
    "typer>=0.15.0",
    # The offline dispatcher parses global options with click directly.
    "click>=8.4.1",
    "rich>=13.0.0",
    # Direct MiniLM ONNX inference; no vector database dependency.
    "onnxruntime>=1.23.2",
    "tokenizers>=0.22.0",
    "numpy>=1.26.0",
    # Cross-encoder reranker and Nomic local embeddings.
    "sentence-transformers>=3.0",
    # Imported directly to bound intra-op threads and build reranker heads.
    "torch>=2.11.0",
    # Native Nomic loading avoids the deprecated remote-code attention API.
    "transformers>=5.6.2",
    # Native KNN search via the sqlite-vec loadable extension. A pure-Python
    # fallback exists (see sqlite_storage/_base.py) for the rare platform whose
    # SQLite build can't load extensions, but ship the fast path by default.
    "sqlite-vec>=0.1.6",
    "urllib3>=2.7.0",
    # Config documents round-trip exact Decimals (use_decimal=True,
    # allow_nan=False in config_document.py); stdlib json cannot write them.
    "simplejson>=4.2.0",
    "threadpoolctl>=3.6",
    "filelock>=3.20.3",
]

[project.optional-dependencies]
notebooks = ["pandas>=3.0.2"]
# The wrapper is contract-tested against the mem0 2.0, 2.1 and 2.2 lines
# (scripts/verify_mem0_artifact.py and tests/mem0 against the real package).
# Minor releases have shipped breaking API changes, so certify each new line
# before widening.
mem0 = ["mem0ai>=2.0,<2.3"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    "wrapt>=2.1.2",
    "jupyterlab>=4.4.3",
    "ruff>=0.15.0",
    "pyright>=1.1.400",
    "pytest-cov>=6.0",
    "syrupy>=5.0",
    # No ceiling: the lockfile pins the engine. tests/conftest.py refuses any
    # major other than the one whose internal state it writes, with a hint.
    "mutmut>=3.8.0",
    "build>=1.0.0",
    "twine>=6.0.0",
    "polars>=1.40.1",
]

[project.scripts]
reflexio = "reflexio.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# sdist: explicitly list what goes in. Without this, hatchling's default
# file walker follows the `client_dist/reflexio` symlink (which points to
# `../reflexio`), caches the resolved paths, and then skips the real
# top-level `reflexio/` directory as already-seen — producing an sdist
# (and wheel-from-sdist) missing the entire package.
[tool.hatch.build.targets.sdist]
only-include = [
    "reflexio",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    ".env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["reflexio"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "reflexio/data/.env.example"

[tool.pytest.ini_options]
# Parallel test execution with pytest-xdist
# -n auto: Use all available CPU cores
# --dist worksteal: Dynamic load balancing — idle workers steal from busy workers' queues
addopts = "-n auto --dist worksteal --cov --cov-report=term-missing --cov-report=html --timeout=120"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Fast isolated tests with all dependencies mocked",
    "integration: Tests with real storage but mocked LLM",
    "e2e: Full workflow tests with real storage and services",
    "requires_credentials: Tests that need API keys (costs money)",
    "deploy_guard: Structural contracts that block deployment when package layout drifts",
]
filterwarnings = [
    "ignore:This process \\(pid=.*\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning:multiprocessing\\.popen_fork",
]

[tool.coverage.run]
# Measure branch coverage — ensures both if/else paths are tested, not just lines
branch = true
source = ["reflexio"]
omit = [
    "**/__init__.py",
    "tests/*",
    "reflexio/data/*",
    "*/conftest.py",
    "reflexio/scripts/*",
    "reflexio/integrations/openclaw/lab/*",
    "reflexio/reflexio_commons/*",
    "reflexio/server/services/email/templates/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, undefined names)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear (likely bugs & design problems)
    "UP",     # pyupgrade (modern Python syntax)
    "I",      # isort (import sorting)
    "C4",     # flake8-comprehensions (correct dict/list/set usage)
    "SIM",    # flake8-simplify (code simplification patterns)
    "RET",    # flake8-return (return statement quality)
    "PERF",   # perflint (performance anti-patterns)
    "C90",    # McCabe complexity
    "S",      # flake8-bandit (security checks)
    "N",      # pep8-naming conventions
    "ANN",    # flake8-annotations (enforce type annotations)
    "ARG",    # flake8-unused-arguments
    "G",      # flake8-logging-format (no f-strings in logging)
    "PTH",    # flake8-use-pathlib (pathlib over os.path)
    "FURB",   # refurb (modern Python idioms)
    "FLY",    # flynt (string join → f-string)
    "PLR1714",# pylint: repeated-equality-comparison → use `in`
    "PLR1716",# pylint: boolean-chained-comparison → chain
    "TID251", # flake8-tidy-imports: banned APIs (see banned-api below)
]
ignore = [
    "E501",   # line too long (handled by the formatter)
    "E402",   # module-level import not at top (common in __init__.py)
    "ANN002",  # missing type for *args (often inherited from frameworks)
    "ANN003",  # missing type for **kwargs (often inherited from frameworks)
    "ANN204",  # missing return type for __init__ (-> None is obvious)
    "ANN401",  # dynamically typed Any (sometimes intentional)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["S101", "ARG001", "ARG002", "PTH", "ANN", "S105", "S106", "S107", "S108"]
"conftest.py" = ["ARG001"]
"notebooks/**" = ["S101", "F403", "F405", "F821", "S105", "S106", "S110", "ANN", "PTH", "RET504", "S113", "ARG001", "PERF401"]
"benchmark/**" = ["S101", "PTH", "G004", "ANN", "S607", "ARG001", "ARG005"]
"reflexio/scripts/**" = ["S101", "G004", "ANN"]
"reflexio/benchmarks/**" = ["S311"]
"reflexio/server/api.py" = ["B008", "ARG001", "ARG002"]
"reflexio/server/routes/**" = ["B008", "ARG001", "ARG002"]
"reflexio/server/api_endpoints/**" = ["B008", "ARG001", "ARG002"]
"reflexio/integrations/**" = ["ARG002"]
# The OpenClaw lab is a test harness: scenario asserts, the fixed openclaw/lab.sh
# argv it spawns, and its default lab directory under $TMPDIR.
"reflexio/integrations/openclaw/lab/**" = ["S101", "S108", "S603", "S607"]
"reflexio/server/services/configurator/test_config_storage.py" = ["S101", "ANN", "S108"]
"demo/**" = ["S101", "PTH", "G004", "ANN"]
"reflexio/server/services/storage/sqlite_storage/**" = ["S608"]
"reflexio/cli/**" = ["S603", "S607", "S104"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx for HTTP clients (sync and async)."

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["reflexio", "tests"]
exclude = [
    "tests/test_scripts",
    "**/__pycache__",
    "**/.venv",
    "benchmark",
    "notebooks",
]
reportMissingImports = "warning"

[tool.mutmut]
# Forked statistics-pass output otherwise stays in the child's capture buffer.
debug = true
# Stats and baseline suites start threads and initialize native runtimes.
# Fork each mutation from a clean server, never their contaminated parent.
process_isolation = "forkserver"
source_paths = [
    "reflexio/server/services/service_utils.py",
    "reflexio/server/services/deduplication_utils.py",
    "reflexio/server/services/storage/storage_base/_base.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["reflexio/", "scripts/", "skills/", "docs/lib/methods/", ".env.example", ".github/workflows/"]
pytest_add_cli_args = ["-o", "addopts=", "--timeout=120", "--durations=50", "-m", "not integration and not e2e and not requires_credentials"]
